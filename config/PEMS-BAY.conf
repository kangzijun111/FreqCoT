[file]
traffic = ./data/PEMS-BAY/PEMS-BAY.npz
adj = ./data/PEMS-BAY/adj.pkl
meta = ./data/PEMS-BAY/meta_pemsbay.csv
model = ./cpt/pemsbay_freqcot_best
log = ./log/pemsbay_log

[data]
input_len = 12
output_len = 12
train_ratio = 0.7
val_ratio = 0.1
test_ratio = 0.2

[train]
cuda = 0
max_epoch = 120
batch_size = 64
learning_rate = 0.0005
weight_decay = 0.002
seed = 1

[param]
factors = 1
layers = 3
tps = 12
tpn = 1
recur = 5
sps = 12
spn = 32
nodes = 325
tod = 288
dow = 7
id = 1
nd = 64
td = 32
dd = 32